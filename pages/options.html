<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="optionsTitle">GitHub Notes - Options</title>
  <style>
    /* GitHub Primer 语义色（与 github.com 当前主题对齐） */
    :root {
      color-scheme: light dark;
      --bgColor-default: #ffffff;
      --bgColor-muted: #f6f8fa;
      --fgColor-default: #1f2328;
      --fgColor-muted: #59636e;
      --fgColor-accent: #0969da;
      --fgColor-onEmphasis: #ffffff;
      --borderColor-default: #d1d9e0;
      --bgColor-accent-emphasis: #0969da;
      --bgColor-success-emphasis: #1f883d;
      --bgColor-danger-emphasis: #cf222e;
      --button-default-bgColor-rest: #f6f8fa;
      --button-default-bgColor-hover: #eff2f5;
      --button-primary-bgColor-rest: #1f883d;
      --button-primary-bgColor-hover: #1c8139;
      --control-checked-bgColor-rest: #0969da;
      --shadow-resting-medium: 0 1px 1px rgba(37, 41, 46, 0.1), 0 3px 6px rgba(37, 41, 46, 0.12);
      --shadow-floating-small: 0 0 0 1px rgba(209, 217, 224, 0.25), 0 6px 12px -3px rgba(37, 41, 46, 0.04), 0 6px 18px rgba(37, 41, 46, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bgColor-default: #0d1117;
        --bgColor-muted: #151b23;
        --fgColor-default: #f0f6fc;
        --fgColor-muted: #9198a1;
        --fgColor-accent: #4493f8;
        --borderColor-default: #3d444d;
        --bgColor-accent-emphasis: #1f6feb;
        --bgColor-success-emphasis: #238636;
        --bgColor-danger-emphasis: #da3633;
        --button-default-bgColor-rest: #212830;
        --button-default-bgColor-hover: #262c36;
        --button-primary-bgColor-rest: #238636;
        --button-primary-bgColor-hover: #29903b;
        --control-checked-bgColor-rest: #1f6feb;
        --shadow-resting-medium: 0 0 transparent, 0 0 transparent;
        --shadow-floating-small: 0 0 0 1px #3d444d, 0 8px 24px rgba(1, 4, 9, 0.45);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background: var(--bgColor-muted);
      color: var(--fgColor-default);
      line-height: 1.5;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
      padding: 24px;
      border: 1px solid var(--borderColor-default);
      border-radius: 6px;
      background: var(--bgColor-default);
      box-shadow: var(--shadow-resting-medium);
    }

    .hero-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--fgColor-default);
    }

    .hero-description {
      max-width: 620px;
      font-size: 14px;
      color: var(--fgColor-muted);
    }

    .hero-meta {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .version-pill,
    .storage-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border: 1px solid var(--borderColor-default);
      border-radius: 999px;
      background: var(--bgColor-muted);
      font-size: 12px;
      color: var(--fgColor-muted);
      white-space: nowrap;
    }

    .layout {
      display: grid;
      gap: 18px;
    }

    .card {
      padding: 18px;
      border: 1px solid var(--borderColor-default);
      border-radius: 6px;
      background: var(--bgColor-default);
      box-shadow: var(--shadow-resting-medium);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--fgColor-default);
    }

    .card-description {
      font-size: 13px;
      color: var(--fgColor-muted);
      margin-bottom: 16px;
    }

    .settings-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid var(--borderColor-default);
      background: var(--bgColor-muted);
    }

    .settings-copy {
      min-width: 0;
    }

    .settings-name {
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--fgColor-default);
    }

    .settings-help {
      font-size: 12px;
      color: var(--fgColor-muted);
    }

    .toggle {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--control-checked-bgColor-rest);
      flex-shrink: 0;
    }

    .meta-list {
      display: grid;
      gap: 10px;
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid var(--borderColor-default);
      background: var(--bgColor-muted);
      font-size: 13px;
    }

    .meta-key {
      color: var(--fgColor-muted);
    }

    .meta-value {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
      color: var(--fgColor-default);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 32px;
      padding: 5px 16px;
      border: 1px solid var(--borderColor-default);
      border-radius: 6px;
      background: var(--button-default-bgColor-rest);
      color: var(--fgColor-default);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      font-size: 14px;
      font-weight: 500;
    }

    .btn:hover {
      background: var(--button-default-bgColor-hover);
    }

    .btn-primary {
      background: var(--bgColor-accent-emphasis);
      border-color: rgba(31, 35, 40, 0.15);
      color: var(--fgColor-onEmphasis);
    }

    .btn-primary:hover {
      background: #0860ca;
      border-color: rgba(31, 35, 40, 0.15);
    }

    .btn-success {
      background: var(--button-primary-bgColor-rest);
      border-color: rgba(31, 35, 40, 0.15);
      color: var(--fgColor-onEmphasis);
    }

    .btn-success:hover {
      background: var(--button-primary-bgColor-hover);
    }

    @media (prefers-color-scheme: dark) {
      .btn-primary:hover {
        background: #3685f3;
      }
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .action-card {
      padding: 16px;
      border: 1px solid var(--borderColor-default);
      border-radius: 6px;
      background: var(--bgColor-muted);
    }

    .action-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--fgColor-default);
    }

    .action-description {
      font-size: 12px;
      color: var(--fgColor-muted);
      margin-bottom: 12px;
    }

    .file-input {
      display: none;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      max-width: 320px;
      padding: 12px 16px;
      border-radius: 6px;
      color: var(--fgColor-onEmphasis);
      font-weight: 500;
      z-index: 1000;
      transform: translateX(110%);
      transition: transform 0.25s ease;
      box-shadow: var(--shadow-floating-small);
    }

    .notification.show {
      transform: translateX(0);
    }

    .notification.success {
      background: var(--bgColor-success-emphasis);
    }

    .notification.error {
      background: var(--bgColor-danger-emphasis);
    }

    .notification.info {
      background: var(--bgColor-accent-emphasis);
    }

    @media (max-width: 680px) {
      .container {
        padding: 20px 14px 28px;
      }

      .hero,
      .settings-row,
      .meta-item {
        flex-direction: column;
      }

      .hero-meta {
        align-items: flex-start;
      }

      .action-grid {
        grid-template-columns: 1fr;
      }

      .btn-row {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div>
        <h1 class="hero-title" data-i18n="optionsHeader">GitHub Notes</h1>
        <p class="hero-description" data-i18n="settingsDescription">只保留会影响日常使用体验的核心设置。</p>
      </div>
      <div class="hero-meta">
        <div class="version-pill" id="pluginVersion">Version 1.0.0</div>
        <div class="storage-pill" data-i18n="localOnlyStorage">仅本地存储</div>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <div class="card-title" data-i18n="generalSettings">常规设置</div>
        <div class="card-description" data-i18n="notificationDescription">在保存、删除备注时显示通知</div>
        <div class="settings-row">
          <div class="settings-copy">
            <div class="settings-name" data-i18n="enableNotifications">启用通知</div>
            <div class="settings-help" id="settingsStatus">-</div>
          </div>
          <input type="checkbox" id="enableNotifications" class="toggle" data-i18n-aria-label="enableNotifications" aria-label="Enable Notifications">
        </div>
        <div class="settings-row">
          <div class="settings-copy">
            <div class="settings-name" data-i18n="openInSidePanel">默认在侧边栏打开</div>
            <div class="settings-help" id="openInSidePanelHelp" data-i18n="openInSidePanelHelp">开启并保存后，点击扩展图标将直接打开侧边栏</div>
          </div>
          <input type="checkbox" id="openInSidePanel" class="toggle" data-i18n-aria-label="openInSidePanel" aria-label="Open in side panel by default">
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="saveSettingsBtn" data-i18n="saveSettings">保存设置</button>
          <button class="btn" id="resetSettingsBtn" data-i18n="resetSettings">重置设置</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title" data-i18n="dataBackup">数据备份</div>
        <div class="card-description" data-i18n="backupTipsDescription">建议在重装浏览器或清理本地数据前先导出备份文件。</div>
        <div class="action-grid">
          <div class="action-card">
            <div class="action-title" data-i18n="exportDataTitle">导出数据</div>
            <div class="action-description" data-i18n="exportDataDescription">将所有备注和设置数据导出为 JSON 文件</div>
            <button class="btn btn-success" id="exportAllBtn" data-i18n="exportData">导出数据</button>
          </div>
          <div class="action-card">
            <div class="action-title" data-i18n="importDataTitle">导入数据</div>
            <div class="action-description" data-i18n="importDataDescription">从 JSON 文件导入备注和设置数据</div>
            <button class="btn btn-primary" id="importBtn" data-i18n="selectFileImport">选择文件导入</button>
            <input type="file" id="importFile" class="file-input" accept=".json">
          </div>
        </div>
        <div class="meta-list">
          <div class="meta-item">
            <span class="meta-key" data-i18n="notesCountLabel">备注数量</span>
            <span class="meta-value" id="overviewNoteCount">0</span>
          </div>
          <div class="meta-item">
            <span class="meta-key" data-i18n="latestUpdateLabel">最近更新</span>
            <span class="meta-value" id="overviewLatestUpdate">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-key" data-i18n="lastBackupLabel">最近备份</span>
            <span class="meta-value" id="backupLastTime">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-key" data-i18n="lastImportLabel">最近导入</span>
            <span class="meta-value" id="importLastTime">-</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../src/i18n.js"></script>
  <script src="../src/options.js"></script>
</body>
</html>
