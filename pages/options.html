<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="optionsTitle">GitHub Notes - Options</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      color-scheme: light dark;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background: #f6f8fa;
      color: #24292f;
      line-height: 1.5;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
      padding: 24px;
      border: 1px solid #d0d7de;
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(9, 105, 218, 0.08), rgba(9, 105, 218, 0)),
        #ffffff;
      box-shadow: 0 12px 30px rgba(31, 35, 40, 0.06);
    }

    .hero-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hero-description {
      max-width: 620px;
      font-size: 14px;
      color: #656d76;
    }

    .hero-meta {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .version-pill,
    .storage-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border: 1px solid #d0d7de;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      font-size: 12px;
      color: #57606a;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      gap: 18px;
    }

    .card {
      padding: 18px;
      border: 1px solid #d0d7de;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(31, 35, 40, 0.04);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-description {
      font-size: 13px;
      color: #656d76;
      margin-bottom: 16px;
    }

    .settings-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #d0d7de;
      background: #f6f8fa;
    }

    .settings-copy {
      min-width: 0;
    }

    .settings-name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .settings-help {
      font-size: 12px;
      color: #656d76;
    }

    .toggle {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: #0969da;
      flex-shrink: 0;
    }

    .meta-list {
      display: grid;
      gap: 10px;
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #d0d7de;
      background: #f6f8fa;
      font-size: 13px;
    }

    .meta-key {
      color: #656d76;
    }

    .meta-value {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      background: #ffffff;
      color: #24292f;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #f3f4f6;
      border-color: #afb8c1;
    }

    .btn-primary {
      background: #0969da;
      border-color: #0969da;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #0860ca;
      border-color: #0860ca;
    }

    .btn-success {
      background: #1f883d;
      border-color: #1f883d;
      color: #ffffff;
    }

    .btn-success:hover {
      background: #1a7f37;
      border-color: #1a7f37;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .action-card {
      padding: 16px;
      border: 1px solid #d0d7de;
      border-radius: 14px;
      background: #f6f8fa;
    }

    .action-title {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .action-description {
      font-size: 12px;
      color: #656d76;
      margin-bottom: 12px;
    }

    .file-input {
      display: none;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      max-width: 320px;
      padding: 12px 16px;
      border-radius: 10px;
      color: #ffffff;
      font-weight: 500;
      z-index: 1000;
      transform: translateX(110%);
      transition: transform 0.25s ease;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
    }

    .notification.show {
      transform: translateX(0);
    }

    .notification.success {
      background: #1f883d;
    }

    .notification.error {
      background: #da3633;
    }

    .notification.info {
      background: #0969da;
    }

    @media (max-width: 680px) {
      .container {
        padding: 20px 14px 28px;
      }

      .hero,
      .settings-row,
      .meta-item {
        flex-direction: column;
      }

      .hero-meta {
        align-items: flex-start;
      }

      .action-grid {
        grid-template-columns: 1fr;
      }

      .btn-row {
        width: 100%;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0d1117;
        color: #f0f6fc;
      }

      .hero,
      .card,
      .btn {
        background: #161b22;
        border-color: #30363d;
        color: #f0f6fc;
      }

      .hero {
        background:
          linear-gradient(180deg, rgba(31, 111, 235, 0.18), rgba(31, 111, 235, 0)),
          #161b22;
      }

      .version-pill,
      .storage-pill,
      .settings-row,
      .meta-item,
      .action-card {
        background: #0d1117;
        border-color: #30363d;
        color: #f0f6fc;
      }

      .hero-description,
      .card-description,
      .settings-help,
      .meta-key,
      .action-description {
        color: #8b949e;
      }

      .btn:hover {
        background: #21262d;
      }

      .btn-primary {
        background: #1f6feb;
        border-color: #1f6feb;
      }

      .btn-success {
        background: #238636;
        border-color: #238636;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div>
        <h1 class="hero-title" data-i18n="optionsHeader">GitHub Notes</h1>
        <p class="hero-description" data-i18n="settingsDescription">只保留会影响日常使用体验的核心设置。</p>
      </div>
      <div class="hero-meta">
        <div class="version-pill" id="pluginVersion">Version 1.0.0</div>
        <div class="storage-pill" data-i18n="localOnlyStorage">仅本地存储</div>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <div class="card-title" data-i18n="generalSettings">常规设置</div>
        <div class="card-description" data-i18n="notificationDescription">在保存、删除备注时显示通知</div>
        <div class="settings-row">
          <div class="settings-copy">
            <div class="settings-name" data-i18n="enableNotifications">启用通知</div>
            <div class="settings-help" id="settingsStatus">-</div>
          </div>
          <input type="checkbox" id="enableNotifications" class="toggle" data-i18n-aria-label="enableNotifications" aria-label="Enable Notifications">
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="saveSettingsBtn" data-i18n="saveSettings">保存设置</button>
          <button class="btn" id="resetSettingsBtn" data-i18n="resetSettings">重置设置</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title" data-i18n="dataBackup">数据备份</div>
        <div class="card-description" data-i18n="backupTipsDescription">建议在重装浏览器或清理本地数据前先导出备份文件。</div>
        <div class="action-grid">
          <div class="action-card">
            <div class="action-title" data-i18n="exportDataTitle">导出数据</div>
            <div class="action-description" data-i18n="exportDataDescription">将所有备注和设置数据导出为 JSON 文件</div>
            <button class="btn btn-success" id="exportAllBtn" data-i18n="exportData">导出数据</button>
          </div>
          <div class="action-card">
            <div class="action-title" data-i18n="importDataTitle">导入数据</div>
            <div class="action-description" data-i18n="importDataDescription">从 JSON 文件导入备注和设置数据</div>
            <button class="btn btn-primary" id="importBtn" data-i18n="selectFileImport">选择文件导入</button>
            <input type="file" id="importFile" class="file-input" accept=".json">
          </div>
        </div>
        <div class="meta-list">
          <div class="meta-item">
            <span class="meta-key" data-i18n="notesCountLabel">备注数量</span>
            <span class="meta-value" id="overviewNoteCount">0</span>
          </div>
          <div class="meta-item">
            <span class="meta-key" data-i18n="latestUpdateLabel">最近更新</span>
            <span class="meta-value" id="overviewLatestUpdate">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-key" data-i18n="lastBackupLabel">最近备份</span>
            <span class="meta-value" id="backupLastTime">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-key" data-i18n="lastImportLabel">最近导入</span>
            <span class="meta-value" id="importLastTime">-</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../src/i18n.js"></script>
  <script src="../src/options.js"></script>
</body>
</html>
