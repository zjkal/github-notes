<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="popupTitle">GitHub备注管理</title>
  <style>
    /* GitHub Primer 语义色（与 github.com 当前主题对齐） */
    :root {
      color-scheme: light dark;
      --bgColor-default: #ffffff;
      --bgColor-muted: #f6f8fa;
      --fgColor-default: #1f2328;
      --fgColor-muted: #59636e;
      --fgColor-accent: #0969da;
      --fgColor-success: #1a7f37;
      --fgColor-danger: #d1242f;
      --borderColor-default: #d1d9e0;
      --bgColor-accent-muted: #ddf4ff;
      --bgColor-accent-emphasis: #0969da;
      --bgColor-success-muted: #dafbe1;
      --bgColor-success-emphasis: #1f883d;
      --bgColor-danger-muted: #ffebe9;
      --bgColor-danger-emphasis: #cf222e;
      --button-default-bgColor-rest: #f6f8fa;
      --button-default-bgColor-hover: #eff2f5;
      --focus-outlineColor: #0969da;
      --focus-shadow: 0 0 0 3px rgba(9, 105, 218, 0.12);
      --shadow-floating-small: 0 0 0 1px rgba(209, 217, 224, 0.25), 0 6px 12px -3px rgba(37, 41, 46, 0.04), 0 6px 18px rgba(37, 41, 46, 0.12);
      --scrollbar-thumb: #c1c7cf;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bgColor-default: #0d1117;
        --bgColor-muted: #151b23;
        --fgColor-default: #f0f6fc;
        --fgColor-muted: #9198a1;
        --fgColor-accent: #4493f8;
        --fgColor-success: #3fb950;
        --fgColor-danger: #f85149;
        --borderColor-default: #3d444d;
        --bgColor-accent-muted: rgba(56, 139, 253, 0.1);
        --bgColor-accent-emphasis: #1f6feb;
        --bgColor-success-muted: rgba(46, 160, 67, 0.15);
        --bgColor-success-emphasis: #238636;
        --bgColor-danger-muted: rgba(248, 81, 73, 0.1);
        --bgColor-danger-emphasis: #da3633;
        --button-default-bgColor-rest: #212830;
        --button-default-bgColor-hover: #262c36;
        --focus-outlineColor: #1f6feb;
        --focus-shadow: 0 0 0 3px rgba(31, 111, 235, 0.2);
        --shadow-floating-small: 0 0 0 1px #3d444d, 0 8px 24px rgba(1, 4, 9, 0.45);
        --scrollbar-thumb: #3d444d;
      }
    }

    html {
      width: 400px;
      min-width: 400px;
      height: 100%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-width: 400px;
      min-height: 540px;
      height: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background: var(--bgColor-muted);
      color: var(--fgColor-default);
      overflow: hidden;
    }

    html[data-surface="sidebar"] {
      width: 100%;
      min-width: 0;
    }

    body[data-surface="sidebar"] {
      width: 100%;
      min-width: 0;
      min-height: 100vh;
      height: 100vh;
    }

    button,
    input,
    a {
      font: inherit;
    }

    .app {
      display: flex;
      flex-direction: column;
      min-height: 540px;
      background: var(--bgColor-default);
    }

    body[data-surface="sidebar"] .app {
      min-height: 100vh;
      height: 100vh;
    }

    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--borderColor-default);
      background: var(--bgColor-default);
    }

    .brand-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .title-group {
      min-width: 0;
    }

    .title-group h1 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--fgColor-default);
    }

    .subtitle {
      margin-top: 3px;
      font-size: 12px;
      color: var(--fgColor-muted);
      line-height: 1.5;
    }

    body[data-surface="popup"] .subtitle {
      display: none;
    }

    .surface-toggle-btn {
      flex-shrink: 0;
      border: 1px solid var(--borderColor-default);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--fgColor-accent);
      background: var(--bgColor-default);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .surface-toggle-btn:hover {
      background: var(--button-default-bgColor-hover);
    }

    .surface-toggle-btn[hidden] {
      display: none;
    }

    .quick-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid var(--borderColor-default);
      border-radius: 999px;
      background: var(--bgColor-muted);
    }

    .stat-label {
      font-size: 12px;
      color: var(--fgColor-muted);
    }

    .stat-number {
      font-size: 14px;
      font-weight: 700;
      color: var(--fgColor-accent);
      line-height: 1;
    }

    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      padding: 12px 16px 10px;
      gap: 10px;
      background: var(--bgColor-default);
    }

    .search-box {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 36px 10px 12px;
      border: 1px solid var(--borderColor-default);
      border-radius: 6px;
      background: var(--bgColor-default);
      color: var(--fgColor-default);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--fgColor-muted);
    }

    .search-input:focus {
      border-color: var(--focus-outlineColor);
      box-shadow: var(--focus-shadow);
    }

    .clear-search-btn {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--fgColor-muted);
      cursor: pointer;
      display: none;
    }

    .clear-search-btn:hover {
      background: var(--button-default-bgColor-hover);
      color: var(--fgColor-default);
    }

    .clear-search-btn.visible {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .notes-panel {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
    }

    .notes-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0;
    }

    .note-item {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid var(--borderColor-default);
      border-radius: 6px;
      background: var(--bgColor-default);
      color: var(--fgColor-default);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .note-item:last-child {
      margin-bottom: 0;
    }

    .note-item:hover,
    .note-item:focus-visible {
      border-color: var(--focus-outlineColor);
      box-shadow: var(--focus-shadow);
      outline: none;
    }

    .note-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .note-repo-block {
      min-width: 0;
    }

    .note-repo-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--fgColor-accent);
      line-height: 1.35;
      word-break: break-word;
    }

    .note-owner {
      margin-top: 2px;
      font-size: 11px;
      color: var(--fgColor-muted);
      line-height: 1.4;
      word-break: break-word;
    }

    .note-open-hint {
      flex-shrink: 0;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--bgColor-accent-muted);
      color: var(--fgColor-accent);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
    }

    .note-content {
      font-size: 13px;
      line-height: 1.55;
      color: var(--fgColor-default);
      white-space: pre-wrap;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
      word-break: break-word;
    }

    body[data-surface="sidebar"] .note-content {
      -webkit-line-clamp: 3;
    }

    .note-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--fgColor-muted);
    }

    .empty-state,
    .loading {
      padding: 36px 18px;
      text-align: center;
      color: var(--fgColor-muted);
    }

    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--fgColor-default);
      margin-bottom: 6px;
    }

    .empty-description {
      font-size: 12px;
      line-height: 1.6;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 16px 12px;
      border-top: 1px solid var(--borderColor-default);
      background: var(--bgColor-default);
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      min-width: 0;
    }

    .footer-link,
    .footer a {
      border: none;
      padding: 0;
      background: transparent;
      color: var(--fgColor-accent);
      text-decoration: none;
      font-size: 12px;
      line-height: 1.4;
      cursor: pointer;
    }

    .footer-link:hover,
    .footer a:hover {
      text-decoration: underline;
    }

    .footer-link[hidden] {
      display: none;
    }

    .version {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--fgColor-muted);
      white-space: nowrap;
    }

    .file-input {
      display: none;
    }

    .notification {
      position: fixed;
      top: 12px;
      right: 12px;
      max-width: 280px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 1000;
      transform: translateX(110%);
      transition: transform 0.25s ease;
      box-shadow: var(--shadow-floating-small);
    }

    .notification.show {
      transform: translateX(0);
    }

    .notification.success {
      background: var(--bgColor-success-muted);
      color: var(--fgColor-success);
      border: 1px solid var(--bgColor-success-emphasis);
    }

    .notification.error {
      background: var(--bgColor-danger-muted);
      color: var(--fgColor-danger);
      border: 1px solid var(--bgColor-danger-emphasis);
    }

    .notes-list::-webkit-scrollbar {
      width: 6px;
    }

    .notes-list::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 999px;
    }

    @media (max-width: 360px) {
      .brand-row,
      .footer,
      .note-meta {
        flex-direction: column;
        align-items: stretch;
      }

      .note-topline {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand-row">
        <div class="title-group">
          <h1 data-i18n="popupTitle">GitHub备注管理</h1>
          <div class="subtitle" data-i18n="popupSubtitle">管理您的GitHub仓库备注</div>
        </div>
        <button class="surface-toggle-btn" type="button" id="openSidePanelBtn" data-i18n="openSidePanel" hidden>切换到侧边栏</button>
      </div>
      <div class="quick-stats">
        <div class="stat-pill">
          <span class="stat-label" data-i18n="totalNotes">总备注</span>
          <span class="stat-number" id="totalNotes">0</span>
        </div>
        <div class="stat-pill">
          <span class="stat-label" data-i18n="todayNotes">今日新增</span>
          <span class="stat-number" id="todayNotes">0</span>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="search-box">
        <input type="search" class="search-input" id="searchInput" data-i18n="searchPlaceholder" placeholder="搜索备注...">
        <button class="clear-search-btn" type="button" id="clearSearchBtn" data-i18n-title="clearSearch" aria-label="Clear search">×</button>
      </div>

      <div class="notes-panel">
        <div class="notes-list" id="notesList">
          <div class="loading" data-i18n="loading">加载中...</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-links">
        <button class="footer-link" type="button" id="exportBtn" data-i18n="exportData">导出数据</button>
        <button class="footer-link" type="button" id="importBtn" data-i18n="importData">导入数据</button>
        <a href="#" id="optionsLink" data-i18n="options">选项</a>
        <a href="#" id="helpLink" data-i18n="help">开源仓库</a>
      </div>
      <div class="version" id="popupVersion">v1.0.0</div>
    </div>

    <input type="file" class="file-input" id="importFile" accept=".json">
  </div>

  <script src="../src/i18n.js"></script>
  <script src="../src/popup.js"></script>
</body>
</html>
