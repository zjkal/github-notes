<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="popupTitle">GitHub备注管理</title>
  <style>
    html {
      width: 400px;
      min-width: 400px;
      height: 100%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      color-scheme: light dark;
    }

    body {
      width: 400px;
      min-width: 400px;
      min-height: 540px;
      height: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background: #f6f8fa;
      color: #24292f;
      overflow: hidden;
    }

    html[data-surface="sidebar"] {
      width: 100%;
      min-width: 0;
    }

    body[data-surface="sidebar"] {
      width: 100%;
      min-width: 0;
      min-height: 100vh;
      height: 100vh;
    }

    button,
    input,
    a {
      font: inherit;
    }

    .app {
      display: flex;
      flex-direction: column;
      min-height: 540px;
      background: #ffffff;
    }

    body[data-surface="sidebar"] .app {
      min-height: 100vh;
      height: 100vh;
    }

    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #d8dee4;
      background:
        linear-gradient(180deg, rgba(9, 105, 218, 0.06), rgba(9, 105, 218, 0)),
        #ffffff;
    }

    .brand-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .title-group {
      min-width: 0;
    }

    .title-group h1 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    .subtitle {
      margin-top: 3px;
      font-size: 12px;
      color: #656d76;
      line-height: 1.5;
    }

    body[data-surface="popup"] .subtitle {
      display: none;
    }

    .surface-toggle-btn {
      flex-shrink: 0;
      border: 1px solid #d0d7de;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #0969da;
      background: rgba(255, 255, 255, 0.92);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .surface-toggle-btn:hover {
      background: #f3f4f6;
      border-color: #afb8c1;
    }

    .surface-toggle-btn[hidden] {
      display: none;
    }

    .quick-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid #d0d7de;
      border-radius: 999px;
      background: #f6f8fa;
    }

    .stat-label {
      font-size: 12px;
      color: #656d76;
    }

    .stat-number {
      font-size: 14px;
      font-weight: 700;
      color: #0969da;
      line-height: 1;
    }

    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      padding: 12px 16px 10px;
      gap: 10px;
      background: #ffffff;
    }

    .search-box {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 36px 10px 12px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.12);
    }

    .clear-search-btn {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: #656d76;
      cursor: pointer;
      display: none;
    }

    .clear-search-btn:hover {
      background: #f3f4f6;
      color: #24292f;
    }

    .clear-search-btn.visible {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .notes-panel {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      border: 1px solid #d0d7de;
      border-radius: 14px;
      background: #f6f8fa;
      overflow: hidden;
    }

    .notes-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #d8dee4;
      font-size: 12px;
      color: #656d76;
      background: rgba(255, 255, 255, 0.72);
    }

    .notes-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px;
    }

    .note-item {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      background: #ffffff;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .note-item:last-child {
      margin-bottom: 0;
    }

    .note-item:hover,
    .note-item:focus-visible {
      border-color: #0969da;
      box-shadow: 0 8px 24px rgba(9, 105, 218, 0.12);
      transform: translateY(-1px);
      outline: none;
    }

    .note-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .note-repo-block {
      min-width: 0;
    }

    .note-repo-name {
      font-size: 14px;
      font-weight: 600;
      color: #0969da;
      line-height: 1.35;
      word-break: break-word;
    }

    .note-owner {
      margin-top: 2px;
      font-size: 11px;
      color: #656d76;
      line-height: 1.4;
      word-break: break-word;
    }

    .note-open-hint {
      flex-shrink: 0;
      padding: 3px 8px;
      border-radius: 999px;
      background: #ddf4ff;
      color: #0550ae;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
    }

    .note-content {
      font-size: 13px;
      line-height: 1.55;
      color: #24292f;
      white-space: pre-wrap;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
      word-break: break-word;
    }

    body[data-surface="sidebar"] .note-content {
      -webkit-line-clamp: 3;
    }

    .note-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #656d76;
    }

    .empty-state,
    .loading {
      padding: 36px 18px;
      text-align: center;
      color: #656d76;
    }

    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: #24292f;
      margin-bottom: 6px;
    }

    .empty-description {
      font-size: 12px;
      line-height: 1.6;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 16px 12px;
      border-top: 1px solid #d8dee4;
      background: #ffffff;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      min-width: 0;
    }

    .footer-link,
    .footer a {
      border: none;
      padding: 0;
      background: transparent;
      color: #0969da;
      text-decoration: none;
      font-size: 12px;
      line-height: 1.4;
      cursor: pointer;
    }

    .footer-link:hover,
    .footer a:hover {
      text-decoration: underline;
    }

    .footer-link[hidden] {
      display: none;
    }

    .version {
      flex-shrink: 0;
      font-size: 11px;
      color: #656d76;
      white-space: nowrap;
    }

    .file-input {
      display: none;
    }

    .notification {
      position: fixed;
      top: 12px;
      right: 12px;
      max-width: 280px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 1000;
      transform: translateX(110%);
      transition: transform 0.25s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .notification.show {
      transform: translateX(0);
    }

    .notification.success {
      background: #dafbe1;
      color: #1a7f37;
      border: 1px solid #1f883d;
    }

    .notification.error {
      background: #ffebe9;
      color: #b62324;
      border: 1px solid #da3633;
    }

    .notes-list::-webkit-scrollbar {
      width: 6px;
    }

    .notes-list::-webkit-scrollbar-thumb {
      background: #c1c7cf;
      border-radius: 999px;
    }

    @media (max-width: 360px) {
      .brand-row,
      .footer,
      .notes-summary,
      .note-meta {
        flex-direction: column;
        align-items: stretch;
      }

      .note-topline {
        flex-direction: column;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0d1117;
        color: #f0f6fc;
      }

      .app,
      .header,
      .main,
      .footer {
        background: #161b22;
      }

      .header,
      .footer,
      .notes-summary {
        border-color: #30363d;
      }

      .header {
        background:
          linear-gradient(180deg, rgba(31, 111, 235, 0.18), rgba(31, 111, 235, 0)),
          #161b22;
      }

      .subtitle,
      .stat-label,
      .notes-summary,
      .note-owner,
      .note-meta,
      .version {
        color: #8b949e;
      }

      .surface-toggle-btn,
      .search-input,
      .stat-pill,
      .notes-panel,
      .note-item {
        background: #0d1117;
        border-color: #30363d;
        color: #f0f6fc;
      }

      .surface-toggle-btn:hover,
      .clear-search-btn:hover {
        background: #21262d;
      }

      .search-input:focus {
        border-color: #58a6ff;
        box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.16);
      }

      .title-group h1,
      .empty-title,
      .note-content {
        color: #f0f6fc;
      }

      .stat-number,
      .note-repo-name,
      .footer-link,
      .footer a {
        color: #58a6ff;
      }

      .note-open-hint {
        background: rgba(56, 139, 253, 0.16);
        color: #58a6ff;
      }

      .notes-summary {
        background: rgba(13, 17, 23, 0.78);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand-row">
        <div class="title-group">
          <h1 data-i18n="popupTitle">GitHub备注管理</h1>
          <div class="subtitle" data-i18n="popupSubtitle">管理您的GitHub仓库备注</div>
        </div>
        <button class="surface-toggle-btn" type="button" id="openSidePanelBtn" data-i18n="openSidePanel" hidden>切换到侧边栏</button>
      </div>
      <div class="quick-stats">
        <div class="stat-pill">
          <span class="stat-label" data-i18n="totalNotes">总备注</span>
          <span class="stat-number" id="totalNotes">0</span>
        </div>
        <div class="stat-pill">
          <span class="stat-label" data-i18n="todayNotes">今日新增</span>
          <span class="stat-number" id="todayNotes">0</span>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="search-box">
        <input type="search" class="search-input" id="searchInput" data-i18n="searchPlaceholder" placeholder="搜索备注...">
        <button class="clear-search-btn" type="button" id="clearSearchBtn" data-i18n-title="clearSearch" aria-label="Clear search">×</button>
      </div>

      <div class="notes-panel">
        <div class="notes-summary">
          <span id="notesSummaryText" data-i18n="recentlyUpdated">最近更新</span>
          <span id="resultsCount"></span>
        </div>

        <div class="notes-list" id="notesList">
          <div class="loading" data-i18n="loading">加载中...</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-links">
        <button class="footer-link" type="button" id="exportBtn" data-i18n="exportData">导出数据</button>
        <button class="footer-link" type="button" id="importBtn" data-i18n="importData">导入数据</button>
        <a href="#" id="optionsLink" data-i18n="options">选项</a>
        <a href="#" id="helpLink" data-i18n="help">帮助</a>
      </div>
      <div class="version" id="popupVersion">v1.0.0</div>
    </div>

    <input type="file" class="file-input" id="importFile" accept=".json">
  </div>

  <script src="../src/i18n.js"></script>
  <script src="../src/popup.js"></script>
</body>
</html>
